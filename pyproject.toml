[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patala-research-ci"
version = "0.2.0"
description = "Continuous verification for research built on evolving scholarly knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tom Prior"}]
keywords = ["OpenAIRE", "open-science", "provenance", "research-intelligence", "continuous-verification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = []

[project.scripts]
patala-ci = "patala_research_ci.cli:main"

[tool.setuptools.packages.find]
include = ["patala_research_ci*"]

[project.urls]
Homepage = "https://github.com/prx0r/hackathon1"
Repository = "https://github.com/prx0r/hackathon1"
Documentation = "https://github.com/prx0r/hackathon1#readme"

